<!doctype html>
<html lang="ja">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ごみ分別データベース（MVP）</title>
<link rel="stylesheet" href="https://unpkg.com/mvp.css">
<style>
  :root { --primary:#1976d2; --muted:#6b7280; }
  main { max-width: 1000px; margin: 0 auto; padding: 0 12px; }
  /* 都市コンボ＋キーワード＋検索/リセット（4カラム） */
  .toolbar { display:grid; gap:.75rem; grid-template-columns: 2fr 2fr auto auto; align-items:end; }
  @media (max-width: 720px){ .toolbar { grid-template-columns: 1fr 1fr; } }
  .muted { color:var(--muted); }

  /* コンボボックス */
  .combo { position: relative; }
  .combo input[type="text"]{ width:100%; }
  .suggest {
    position:absolute; inset:auto 0 0 0; top:100%; margin-top:4px;
    background:#fff; border:1px solid #e5e7eb; border-radius:8px;
    max-height: 280px; overflow:auto; z-index:1003; box-shadow:0 8px 24px rgba(0,0,0,.08);
    display:none;
  }
  .suggest.open{ display:block; }
  .suggest ul{ list-style:none; margin:0; padding:4px; }
  .suggest li{
    padding:8px 10px; border-radius:6px; cursor:pointer; line-height:1.2;
    display:flex; gap:6px; align-items:center;
  }
  .suggest li:hover, .suggest li[aria-selected="true"]{ background:#f1f5f9; }
  .badge{ font:12px/1 system-ui; color:#334155; background:#e2e8f0; border-radius:999px; padding:2px 6px; }
  .cityline{ display:flex; gap:6px; align-items:center; }
  .pref{ color:#475569; }

  /* テーブル */
  .table-wrap { overflow-x:auto; border:1px solid #e5e7eb; border-radius:8px; }
  table { width:100%; border-collapse:collapse; table-layout:auto; }
  thead th { position:sticky; top:0; background:var(--primary); color:#fff; cursor:pointer; }
  th, td { padding:6px 8px; border-bottom:1px solid #eee; vertical-align:top; }
  tbody tr:nth-child(odd){ background:#f8fbff; }
  thead th:nth-child(1){ width: 8.5em; }
  thead th:nth-child(2){ width: 12em; }
  thead th:nth-child(3){ width: 16em; }
  thead th:nth-child(4){ width: 12em; }
  td:nth-child(1), td:nth-child(2), td:nth-child(4){ white-space:nowrap; }
  td:nth-child(3){ white-space:normal; }

  /* カード（モバイル） */
  .cards { display:grid; gap:12px; }
  .card { border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px; background:#fff; }
  .card h3 { margin:0 0 6px; font-size:16px; line-height:1.3; }
  .meta { color:var(--muted); font-size:12px; margin-bottom:8px; }
  .btn-row { display:flex; gap:8px; margin-top:4px; }

  button.linklike {
    background:none; border:none; color:#1d4ed8; padding:0; margin:0;
    font: inherit; text-decoration: underline; cursor:pointer; line-height:1.2;
  }
  button.linklike:hover { text-decoration: none; }

  /* ページャ */
  .view-toggle { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin:.5rem 0; }

  /* モーダル */
  dialog { width:min(720px, 96vw); border:none; border-radius:12px; padding:0; z-index:1000; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .modal article { padding:12px 16px 16px; position: relative; }
  .modal header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; color:#111; }
  .modal h3 { margin:0; font-size:18px; }
  .close-btn{
    position: absolute; top: 8px; right: 10px; width: 28px; height: 28px;
    display:flex; align-items:center; justify-content:center;
    background:#fff; color:#111; border:1px solid #e5e7eb; border-radius:999px;
    font-size:18px; line-height:1; cursor:pointer; pointer-events:auto; z-index:1002;
  }
  .close-btn:hover { opacity:.9; }
  .kv { display:grid; grid-template-columns: 9em 1fr; gap:6px 12px; }
  .kv b { color:#111; text-align:right; }
  .kv div { word-break:break-word; }
</style>

<header>
  <h1>ごみ分別データベース</h1>
  <p class="muted">スマホ優先。表は「都道府県 / 市区町村 / 品名 / 分別」＋詳細はポップアップ。</p>
</header>

<main>
  <section class="toolbar">
    <!-- ▼ 市区町村：検索コンボ（タイプアヘッド） -->
    <label>市区町村<br>
      <div class="combo" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-owns="citySuggest">
        <input id="cityInput" type="text" placeholder="例：横浜市 / 大阪市 / 札幌…" autocomplete="off" aria-autocomplete="list" />
        <div id="citySuggest" class="suggest" role="listbox" aria-label="市区町村候補">
          <ul></ul>
        </div>
      </div>
    </label>
    <!-- ▼ キーワード -->
    <label>キーワード<br><input id="q" placeholder="品名・注意など" /></label>
    <button id="search">検索</button>
    <button id="reset" class="secondary">リセット</button>
  </section>

  <div class="view-toggle">
    <label class="muted">表示</label>
    <select id="displayMode">
      <option value="auto" selected>自動（モバイル=カード/PC=表）</option>
      <option value="cards">カード</option>
      <option value="table">表</option>
    </select>
    <label class="muted">件数</label>
    <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
    <button id="prev" class="secondary">前へ</button>
    <span id="pageInfo" class="muted">1 / 1</span>
    <button id="next" class="secondary">次へ</button>
  </div>

  <!-- テーブル -->
  <div id="tableView" class="table-wrap" style="display:none;">
    <table id="tbl">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- カード -->
  <div id="cardView" class="cards" style="display:none;"></div>
</main>

<footer>
  <small>© gomi-site | 自治体公式サイトの情報を出典としています。</small>
</footer>

<!-- 詳細モーダル -->
<dialog id="detailDialog" class="modal">
  <article>
    <header>
      <h3 id="detailTitle">詳細</h3>
      <button id="detailClose" class="close-btn" aria-label="閉じる" type="button">&times;</button>
    </header>
    <div class="kv" id="detailBody"></div>
  </article>
</dialog>

<script type="module" src="src/app.js"></script>
</html>
